name: property tests

on:
  workflow_call:
    inputs:
      profile:
        description: "HYPOTHESIS_PROFILE: ci (fixed inputs) or deep (5x the examples, new inputs every run)"
        type: string
        default: ci

jobs:
  properties:
    name: property tests (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPOTHESIS_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - run: pip install -r requirements-test.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            map/package-lock.json
            test/package-lock.json

      # map/ for the swc that test/jsx_loader.mjs compiles with, test/ for fast-check
      - run: npm ci
        working-directory: map

      - run: npm ci
        working-directory: test

      # compose owns the emulator's flags -- see the note in ci.yml's python job
      - name: Start the datastore emulator
        run: docker compose up -d datastore_test

      - name: Wait for the emulator
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8001/ >/dev/null && exit 0
            sleep 1
          done
          echo "emulator never came up"
          docker compose logs datastore_test
          exit 1

      - name: Python properties
        env:
          REQUIRE_DATASTORE_EMULATOR: "1"
        run: python -m unittest discover -s test -p "*_props.py" -t . -v

      - name: JS properties
        if: ${{ !cancelled() }}
        run: node --import ./test/jsx_loader.mjs --test test/*_props.mjs

      - name: What a property failure means
        if: failure()
        run: |
          echo "A generated input broke a rule the code promises. The failing example and a"
          echo "@reproduce_failure blob (Python) or seed and path (fast-check) are printed above."
          echo "An 'unexpected success' means a known bug got fixed: delete its expectedFailure"
          echo "marker and the mask in its property, together: grep -n expectedFailure test/*_props.py"
